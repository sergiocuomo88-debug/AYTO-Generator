<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Cosmic Jumper 🚀</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #gameWrapper {
      position: relative;
      width: min(100vw, 420px);
      height: min(100dvh, 740px);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 12px;
    }

    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .score-box {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 6px 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    .score-box span {
      font-size: 20px;
      color: #a78bfa;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,26,0.85);
      border-radius: 12px;
      color: #fff;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }

    #overlay h1 {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #overlay p {
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      line-height: 1.5;
      max-width: 280px;
    }

    #overlay .final-score {
      font-size: 1.2rem;
      color: #a78bfa;
      font-weight: 700;
    }

    #startBtn {
      margin-top: 8px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 40px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(124,58,237,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.5px;
    }

    #startBtn:active { transform: scale(0.96); }

    .hint {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-top: -4px;
    }

    #comboFlash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #facc15;
      font-size: 1.5rem;
      font-weight: 900;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      text-shadow: 0 0 20px #facc15;
    }
  </style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div class="score-box">Score<br><span id="scoreDisplay">0</span></div>
    <div class="score-box">Best<br><span id="bestDisplay">0</span></div>
    <div class="score-box">x<span id="speedDisplay">1</span></div>
  </div>

  <div id="comboFlash"></div>

  <div id="overlay">
    <h1>🚀 Cosmic<br>Jumper</h1>
    <p>Tippe oder drücke <strong>Leertaste</strong> um zu springen.<br>Doppeltippe für einen Doppelsprung!</p>
    <button id="startBtn">STARTEN</button>
    <span class="hint">Touchscreen & Keyboard</span>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const overlay        = document.getElementById('overlay');
const scoreDisplay   = document.getElementById('scoreDisplay');
const bestDisplay    = document.getElementById('bestDisplay');
const speedDisplay   = document.getElementById('speedDisplay');
const startBtn       = document.getElementById('startBtn');
const comboFlash     = document.getElementById('comboFlash');

// ── Canvas size ──────────────────────────────────────────────────────────────
function resize() {
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Stars background ─────────────────────────────────────────────────────────
const STAR_COUNT = 120;
const stars = Array.from({length: STAR_COUNT}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 0.3 + 0.05,
  alpha: Math.random() * 0.8 + 0.2,
}));

function drawStars(speed) {
  stars.forEach(s => {
    s.x -= s.speed * speed * 0.0005;
    if (s.x < 0) { s.x = 1; s.y = Math.random(); }
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Particles ────────────────────────────────────────────────────────────────
const particles = [];

function spawnParticles(x, y, color, count=8) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: Math.random() * 5 + 2,
      alpha: 1,
      color,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.alpha -= 0.035;
    p.r *= 0.97;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Game state ───────────────────────────────────────────────────────────────
let state = 'idle'; // idle | running | dead
let score, best, gameSpeed, groundY, jumpCount, jumpsAllowed;
let obstacles, coins, powerups;
let frameCount, comboTimeout;
let playerY, playerVY, playerOnGround;
let shieldActive, shieldTimer;
let flashAlpha = 0;

const GRAVITY      = 0.55;
const JUMP_FORCE   = -13;
const PLAYER_X     = 80;
const PLAYER_W     = 36;
const PLAYER_H     = 44;
const GROUND_FRAC  = 0.78;

function initGame() {
  score        = 0;
  gameSpeed    = 5;
  frameCount   = 0;
  obstacles    = [];
  coins        = [];
  powerups     = [];
  particles.length = 0;
  jumpCount    = 0;
  jumpsAllowed = 2;
  shieldActive = false;
  shieldTimer  = 0;
  flashAlpha   = 0;
  groundY      = canvas.height * GROUND_FRAC;
  playerY      = groundY - PLAYER_H;
  playerVY     = 0;
  playerOnGround = true;
}

// ── Player ───────────────────────────────────────────────────────────────────
function drawPlayer() {
  const x = PLAYER_X, y = playerY, w = PLAYER_W, h = PLAYER_H;

  // Shield glow
  if (shieldActive) {
    ctx.save();
    ctx.shadowColor = '#60a5fa';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = 'rgba(96,165,250,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w * 0.9, h * 0.8, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Body gradient
  const grad = ctx.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, '#a78bfa');
  grad.addColorStop(1, '#7c3aed');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 8);
  ctx.fill();

  // Visor
  ctx.fillStyle = 'rgba(96,165,250,0.8)';
  ctx.beginPath();
  ctx.roundRect(x + 6, y + 8, w - 12, 14, 5);
  ctx.fill();

  // Legs animation
  const legOff = playerOnGround ? Math.sin(frameCount * 0.3) * 4 : 0;
  ctx.fillStyle = '#6d28d9';
  ctx.fillRect(x + 5, y + h - 10, 10, 10 + legOff);
  ctx.fillRect(x + w - 15, y + h - 10, 10, 10 - legOff);

  // Thruster fire when jumping
  if (!playerOnGround) {
    const fireGrad = ctx.createLinearGradient(x + w/2, y + h, x + w/2, y + h + 20);
    fireGrad.addColorStop(0, '#f97316');
    fireGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = fireGrad;
    ctx.beginPath();
    ctx.moveTo(x + 10, y + h);
    ctx.lineTo(x + w - 10, y + h);
    ctx.lineTo(x + w/2, y + h + 18 + Math.random()*6);
    ctx.fill();
  }
}

function updatePlayer() {
  playerVY += GRAVITY;
  playerY  += playerVY;
  groundY   = canvas.height * GROUND_FRAC;

  if (playerY + PLAYER_H >= groundY) {
    playerY = groundY - PLAYER_H;
    playerVY = 0;
    playerOnGround = true;
    jumpCount = 0;
  } else {
    playerOnGround = false;
  }
}

function jump() {
  if (state !== 'running') return;
  if (jumpCount < jumpsAllowed) {
    playerVY = JUMP_FORCE * (jumpCount === 1 ? 0.85 : 1);
    jumpCount++;
    playerOnGround = false;
    spawnParticles(PLAYER_X + PLAYER_W/2, playerY + PLAYER_H, '#a78bfa', 6);
  }
}

// ── Obstacles ────────────────────────────────────────────────────────────────
const OBS_SHAPES = ['rock', 'spike', 'laser'];

function spawnObstacle() {
  const groundY = canvas.height * GROUND_FRAC;
  const type  = OBS_SHAPES[Math.floor(Math.random() * OBS_SHAPES.length)];
  const tall  = Math.random() < 0.3 && score > 20;
  const h     = tall ? 70 + Math.random() * 30 : 35 + Math.random() * 25;
  const w     = type === 'laser' ? 18 : 30 + Math.random() * 20;
  obstacles.push({
    x: canvas.width + 40,
    y: groundY - h,
    w, h, type,
    color: type === 'laser' ? '#f43f5e' : type === 'spike' ? '#94a3b8' : '#475569',
    passed: false,
  });
}

function drawObstacle(o) {
  ctx.save();
  if (o.type === 'laser') {
    // Laser pillar with glow
    ctx.shadowColor = '#f43f5e';
    ctx.shadowBlur = 12;
    const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
    g.addColorStop(0, '#fda4af');
    g.addColorStop(1, '#be123c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(o.x, o.y, o.w, o.h, 4);
    ctx.fill();
    // Pulse ring
    ctx.globalAlpha = 0.3 + 0.3 * Math.sin(frameCount * 0.2);
    ctx.strokeStyle = '#f43f5e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(o.x - 4, o.y - 4, o.w + 8, o.h + 8, 6);
    ctx.stroke();

  } else if (o.type === 'spike') {
    const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
    g.addColorStop(0, '#cbd5e1');
    g.addColorStop(1, '#334155');
    ctx.fillStyle = g;
    // Body
    ctx.fillRect(o.x, o.y + o.h * 0.3, o.w, o.h * 0.7);
    // Spikes
    const spikes = 3;
    const sw = o.w / spikes;
    for (let i = 0; i < spikes; i++) {
      ctx.beginPath();
      ctx.moveTo(o.x + i * sw, o.y + o.h * 0.3);
      ctx.lineTo(o.x + i * sw + sw / 2, o.y);
      ctx.lineTo(o.x + i * sw + sw, o.y + o.h * 0.3);
      ctx.fill();
    }

  } else {
    // Rock
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    const g = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
    g.addColorStop(0, '#64748b');
    g.addColorStop(1, '#1e293b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(o.x, o.y + 8, o.w, o.h - 8, [6, 6, 0, 0]);
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.ellipse(o.x + o.w * 0.3, o.y + 14, o.w * 0.2, 6, -0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ── Coins ────────────────────────────────────────────────────────────────────
function spawnCoin() {
  const groundY = canvas.height * GROUND_FRAC;
  const high = Math.random() < 0.4;
  coins.push({
    x: canvas.width + 20,
    y: high ? groundY - PLAYER_H - 60 - Math.random() * 40 : groundY - PLAYER_H - Math.random() * 20,
    r: 10,
    collected: false,
    spin: 0,
  });
}

function drawCoin(c) {
  c.spin += 0.07;
  ctx.save();
  ctx.shadowColor = '#facc15';
  ctx.shadowBlur = 10;
  const scaleX = Math.abs(Math.cos(c.spin));
  ctx.translate(c.x, c.y);
  ctx.scale(scaleX, 1);
  const g = ctx.createRadialGradient(0, -2, 1, 0, 0, c.r);
  g.addColorStop(0, '#fef08a');
  g.addColorStop(1, '#ca8a04');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fef9c3';
  ctx.font = `bold ${c.r}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, 1);
  ctx.restore();
}

// ── Power-ups ────────────────────────────────────────────────────────────────
function spawnPowerup() {
  const groundY = canvas.height * GROUND_FRAC;
  powerups.push({
    x: canvas.width + 20,
    y: groundY - PLAYER_H - 30,
    r: 14,
    type: 'shield',
    collected: false,
    pulse: 0,
  });
}

function drawPowerup(p) {
  p.pulse += 0.08;
  ctx.save();
  ctx.shadowColor = '#60a5fa';
  ctx.shadowBlur = 15 + 5 * Math.sin(p.pulse);
  const g = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r);
  g.addColorStop(0, '#bfdbfe');
  g.addColorStop(1, '#1d4ed8');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r + 2 * Math.sin(p.pulse), 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `${p.r}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🛡️', p.x, p.y + 1);
  ctx.restore();
}

// ── Ground ───────────────────────────────────────────────────────────────────
let groundOffset = 0;

function drawGround() {
  const gY = canvas.height * GROUND_FRAC;
  groundOffset = (groundOffset + gameSpeed) % 40;

  const grad = ctx.createLinearGradient(0, gY, 0, canvas.height);
  grad.addColorStop(0, '#1e293b');
  grad.addColorStop(1, '#0f172a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gY, canvas.width, canvas.height - gY);

  // Grid lines
  ctx.strokeStyle = 'rgba(99,102,241,0.25)';
  ctx.lineWidth = 1;
  for (let x = -groundOffset; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, gY);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  // Top border glow
  ctx.shadowColor = '#818cf8';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, gY);
  ctx.lineTo(canvas.width, gY);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ── Background ───────────────────────────────────────────────────────────────
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height * GROUND_FRAC);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(1, '#0f0f2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height * GROUND_FRAC);
}

// ── Collision ────────────────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  const pad = 6;
  return ax + pad < bx + bw &&
         ax + aw - pad > bx &&
         ay + pad < by + bh &&
         ay + ah - pad > by;
}

function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nearX = Math.max(rx, Math.min(cx, rx + rw));
  const nearY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nearX, dy = cy - nearY;
  return dx*dx + dy*dy < cr*cr;
}

// ── Flash ────────────────────────────────────────────────────────────────────
function triggerFlash(color) {
  flashAlpha = 0.45;
  flashColor = color;
}
let flashColor = '#f43f5e';

function drawFlash() {
  if (flashAlpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = flashAlpha;
  ctx.fillStyle = flashColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  flashAlpha = Math.max(0, flashAlpha - 0.04);
}

// ── Combo flash ──────────────────────────────────────────────────────────────
let comboVisible = false;
function showCombo(text) {
  comboFlash.textContent = text;
  comboFlash.style.opacity = '1';
  clearTimeout(comboTimeout);
  comboTimeout = setTimeout(() => { comboFlash.style.opacity = '0'; }, 600);
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD() {
  scoreDisplay.textContent = score;
  bestDisplay.textContent  = best || 0;
  speedDisplay.textContent = (gameSpeed / 5).toFixed(1);
}

// ── Main loop ────────────────────────────────────────────────────────────────
let lastObs = 0, lastCoin = 0, lastPowerup = 0;
let animId;

function loop() {
  animId = requestAnimationFrame(loop);
  frameCount++;

  // Speed ramp
  gameSpeed = 5 + score * 0.04;

  // Spawning
  const obsGap = Math.max(60, 100 - score * 0.3);
  if (frameCount - lastObs > obsGap) {
    spawnObstacle();
    lastObs = frameCount;
  }
  if (frameCount - lastCoin > 40) {
    if (Math.random() < 0.6) spawnCoin();
    lastCoin = frameCount;
  }
  if (frameCount - lastPowerup > 300 && Math.random() < 0.008) {
    spawnPowerup();
    lastPowerup = frameCount;
  }

  updatePlayer();
  updateParticles();

  // Move obstacles & check collision
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= gameSpeed;
    if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

    if (!o.passed && o.x + o.w < PLAYER_X) {
      o.passed = true;
      score++;
      updateHUD();
      if (score % 5 === 0) showCombo(`🎯 ${score} Punkte!`);
    }

    if (rectsOverlap(PLAYER_X, playerY, PLAYER_W, PLAYER_H, o.x, o.y, o.w, o.h)) {
      if (shieldActive) {
        shieldActive = false;
        obstacles.splice(i, 1);
        triggerFlash('#60a5fa');
        spawnParticles(PLAYER_X + PLAYER_W/2, playerY + PLAYER_H/2, '#60a5fa', 12);
        showCombo('🛡️ Schild!');
      } else {
        die();
        return;
      }
    }
  }

  // Move coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x -= gameSpeed;
    if (c.x + c.r < 0) { coins.splice(i, 1); continue; }
    const px = PLAYER_X + PLAYER_W/2, py = playerY + PLAYER_H/2;
    if (Math.hypot(px - c.x, py - c.y) < c.r + PLAYER_W/2 + 4) {
      score += 2;
      updateHUD();
      spawnParticles(c.x, c.y, '#facc15', 6);
      coins.splice(i, 1);
    }
  }

  // Move power-ups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.x -= gameSpeed;
    if (p.x + p.r < 0) { powerups.splice(i, 1); continue; }
    const px = PLAYER_X + PLAYER_W/2, py = playerY + PLAYER_H/2;
    if (Math.hypot(px - p.x, py - p.y) < p.r + PLAYER_W/2 + 4) {
      shieldActive = true;
      shieldTimer  = 300;
      spawnParticles(p.x, p.y, '#60a5fa', 10);
      triggerFlash('#60a5fa');
      showCombo('🛡️ Schild aktiv!');
      powerups.splice(i, 1);
    }
  }

  if (shieldActive) {
    shieldTimer--;
    if (shieldTimer <= 0) shieldActive = false;
  }

  // Draw
  drawBackground();
  drawStars(gameSpeed);
  drawGround();
  obstacles.forEach(drawObstacle);
  coins.forEach(drawCoin);
  powerups.forEach(drawPowerup);
  drawParticles();
  drawPlayer();
  drawFlash();
}

function die() {
  state = 'dead';
  if (score > (best || 0)) best = score;
  spawnParticles(PLAYER_X + PLAYER_W/2, playerY + PLAYER_H/2, '#f43f5e', 18);
  triggerFlash('#f43f5e');
  cancelAnimationFrame(animId);

  // Last frame
  drawBackground();
  drawStars(0);
  drawGround();
  drawParticles();
  drawFlash();

  // Show overlay
  overlay.innerHTML = `
    <h1>💥 Game Over</h1>
    <p class="final-score">Score: ${score}</p>
    <p>Bestleistung: <strong>${best}</strong></p>
    <button id="startBtn" onclick="startGame()">NOCHMAL</button>
    <span class="hint">★ Münzen = +2 Punkte &nbsp;|&nbsp; 🛡️ Schild = Schutz</span>
  `;
  overlay.style.display = 'flex';
}

function startGame() {
  overlay.style.display = 'none';
  state = 'running';
  initGame();
  updateHUD();
  lastObs = 0; lastCoin = 0; lastPowerup = 0;
  loop();
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});

let lastTap = 0;
document.getElementById('gameWrapper').addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== 'running') return;
  const now = Date.now();
  jump();
  lastTap = now;
}, { passive: false });

document.getElementById('gameWrapper').addEventListener('mousedown', e => {
  if (state !== 'running') return;
  jump();
});

document.getElementById('startBtn').addEventListener('click', startGame);

// Initial idle render
(function idleRender() {
  drawBackground();
  drawStars(2);
  drawGround();
  requestAnimationFrame(idleRender);
  if (state !== 'idle') return;
})();
</script>
</body>
</html>
